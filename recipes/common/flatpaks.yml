---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json

type: default-flatpaks@v3
source: local
configurations:
  - notify: false # Send notification after install/uninstall is finished (true/false)
    scope: system
    # If no repo information is specified, Flathub will be used by default
    install: # system flatpaks we want all users to have and not remove
      - io.github.celluloid_player.Celluloid
      - com.github.jeromerobert.pdfarranger
      - io.github.realmazharhussain.GdmSettings
      - it.mijorus.gearlever
    remove:
      - org.libreoffice.LibreOffice
      - org.mozilla.firefox
  - scope: user
    install:
      - com.google.AndroidStudio
      - com.vscodium.codium